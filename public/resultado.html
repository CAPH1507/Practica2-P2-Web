<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Cafetería - Pedido enviado</title>
    <link rel="stylesheet" href="resul.css">
</head>
<body>

<header class="encabezado">

    <h1 id="titulo">Cafetería</h1>
    
</header>

<main class="contenedor">

    <article class="pedido">
        <p class="fila"><span class="etiqueta">Nombre:</span>

            <span id="nombre"></span> <span id="apellido"></span></p>

        <p class="fila"><span class="etiqueta">Correo:</span>

            <span id="correo"></span></p>

        <div class="detalle">
            <p><span class="etiqueta">Producto:</span> <span id="producto"></span></p>

            <p><span class="etiqueta">Tamaño:</span> <span id="tamano"></span></p>

            <p><span class="etiqueta">Cantidad:</span> <span id="cantidad"></span></p>

        </div>

        <p class="fila"><span class="etiqueta">Para Llevar:</span>

            <span id="tipoPedido"></span></p>

        <p class="fila"><span class="etiqueta">Observaciones:</span>

            <span id="observaciones"></span></p>

    </article>

</main>

<script src="recibir.js"></script>
</body>
</html>
